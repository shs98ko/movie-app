<!doctype html>
<html>
  <head> </head>
  <body>
    <div id="root"></div>

    <!-- interactive한 ui를 만드는 역할 -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <!-- react element를 html에 두는 역할   -->
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <!-- vanilla js와 다르게 react js는
html에 element를 만들고 js에서 수정하고 조작하는 것이 아닌
js 에서 element를 만들어 html에 붙혀 ui를 만들고 수정하고 조작한다 -->
    <!-- babel-jsx로 적은 코드를 브라우저가 이해할 수 있는 형태로 바꾸줌 -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
      //state : 기본적으로 데이터를 저장하는 곳.
      const root = document.getElementById("root");

      let counter = 0;

      function countUp() {
        counter += 1;
        render();
      }

      function render() {
        ReactDOM.createRoot(root).render(<Container />);
      }

      const Container = () => (
        <div>
          <h3>Total Clicks : {counter}</h3>
          <button onClick={countUp}>Click Me!</button>
        </div>
      );

      //ReactDOM.createRoot(root).render(<Container />);
      render();
    </script>
  </body>
</html>
