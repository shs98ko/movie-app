<html>
  <head> </head>
  <body>
    <div id="root"></div>

    <!-- interactive한 ui를 만드는 역할 -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <!-- react element를 html에 두는 역할   -->
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
      // -- Props --
      // 부모 컴포넌트로부터 자식 컴포넌트에 데이터를 보낼 수 있게 해주는 방법

      /*
        const Btn = (props) => {

            }}

      */
      const Btn = ({ banana, big }) => {
        console.log(banana, big);

        return (
          <button
            style={{
              backgroundColor: "tomato",
              color: "white",
              padding: "10px 20px",
              border: 0,
              borderRadius: 10,
              fontSize: big ? 20 : 10,
            }}
          >
            {banana}
          </button>
        );
      };
      //App, Btn은 함수형 컴포넌트임
      function App() {
        return (
          <div>
            <Btn banana="Save changes" big={true} />
            <Btn banana="Continue" big={false} />
          </div>
        );

        /*
        return 
        (<div>
         Btn({banana:"save changes" x={false}}) 
         <Btn banana="save changes" y={7}/>
         Btn({banana:"Continue"}) 
         <Btn banana="Continue"/>
        </div>)
        */
      }
      const root = document.getElementById("root");
      ReactDOM.createRoot(root).render(<App />);
    </script>
  </body>
</html>
